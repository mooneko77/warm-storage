<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7B32B">
<title>暖暖收納 · 個人收藏管理</title>
<!-- 拖拽排序 SortableJS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<!-- Excel SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- Firebase compat（綁定後才啟用） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#FFF8E7; --bg2:#FFF3D4; --card:#FFFFFF; --card2:#FFFDF6;
  --primary:#F7B32B; --primary-deep:#E89B1C; --primary-soft:#FFE7AE;
  --accent:#FFD98E; --accent2:#FFC55C;
  --text:#5A4632; --text-light:#9A8A74; --line:#F3E4C6;
  --danger:#E57373; --danger-bg:#FDEBEB; --success:#7CB342; --success-bg:#EDF6E3;
  --info:#6FA8DC; --info-bg:#EAF2FB;
  --radius:18px; --radius-sm:12px;
  --shadow:0 6px 22px rgba(247,179,43,.14);
  --shadow-lg:0 14px 40px rgba(90,70,50,.16);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  min-height:100vh;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:15px; color:var(--text);}
a{color:var(--primary-deep); text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#E8CF9A; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== 布局 ===== */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:240px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
  padding:20px 14px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 18px;}
.brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow);}
.brand b{font-size:19px; letter-spacing:.5px;}
.brand small{display:block;color:var(--text-light);font-weight:400;font-size:12px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;color:var(--text);
  font-size:15px;transition:.15s;cursor:pointer;}
.nav-item .ni{font-size:19px;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--accent2)); color:#fff; font-weight:600; box-shadow:var(--shadow);}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--text-light);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:12px 20px; background:rgba(255,248,231,.9); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
#topbar .tb-title{font-size:18px;font-weight:700;}
.search-wrap{flex:1; min-width:180px; max-width:420px; position:relative;}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border-radius:30px;border:1.5px solid var(--line);background:var(--card);outline:none;}
.search-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-light);}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:30px;background:var(--card);border:1.5px solid var(--line);color:var(--text-light);}
.sync-pill.on{color:var(--success);border-color:#CBE5AC;background:var(--success-bg);}
.sync-pill.off{color:var(--text-light);}
.dot{width:8px;height:8px;border-radius:50%;background:#C9C2B4;display:inline-block;}
.sync-pill.on .dot{background:var(--success);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:30px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;box-shadow:var(--shadow);}
.top-btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line);box-shadow:none;}

#views{padding:20px 20px 40px; max-width:1200px; width:100%; margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:fadeIn .25s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 手機底部導航 ===== */
#mnav{display:none;}

/* ===== 卡片 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(243,228,198,.6);}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 14px;}
.sec-title h2{margin:0;font-size:18px;}
.sec-title .sub{color:var(--text-light);font-size:13px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-card{padding:16px 18px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat-card .v{font-size:26px;font-weight:700;}
.stat-card .l{font-size:13px;color:var(--text-light);margin-top:2px;}
.stat-card .em{position:absolute;right:-8px;top:-8px;font-size:52px;opacity:.10;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.cat-card{padding:18px;border-radius:var(--radius);cursor:pointer;transition:.18s;background:var(--card);box-shadow:var(--shadow);position:relative;border:1px solid rgba(243,228,198,.6);}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.cat-card .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:10px;}
.cat-card h3{margin:0 0 4px;font-size:17px;}
.cat-card .meta{font-size:13px;color:var(--text-light);}
.cat-card .count-badge{position:absolute;top:14px;right:14px;background:var(--primary-soft);color:var(--primary-deep);font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;}
.cat-card .low{position:absolute;top:44px;right:14px;font-size:11px;color:var(--danger);}

/* ===== 排序狀態 ===== */
.sort-ghost{opacity:.45;border:2px dashed var(--primary-deep)!important;background:var(--accent)!important;border-radius:var(--radius);}
.sort-drag{opacity:.88;transform:scale(1.03);box-shadow:var(--shadow-lg)!important;z-index:999;}
.sortable-ghost{opacity:.45;border:2px dashed var(--primary-deep)!important;background:var(--accent)!important;}
.sortable-drag{opacity:.88;box-shadow:var(--shadow-lg)!important;}
.sort-handle{cursor:grab;color:var(--text-light);font-size:18px;padding:2px 8px;user-select:none;}
.sort-hint{font-size:12.5px;color:var(--primary-deep);background:var(--primary-soft);padding:6px 12px;border-radius:20px;}

/* ===== 物品列表 ===== */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.item-card{padding:12px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:.18s;border:1px solid rgba(243,228,198,.6);position:relative;}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.item-thumb{width:100%;aspect-ratio:1/1;border-radius:var(--radius-sm);object-fit:cover;background:var(--bg2);display:block;}
.item-thumb.noimg{display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,var(--bg2),var(--primary-soft));}
.item-card h4{margin:9px 2px 3px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-card .meta{font-size:12.5px;color:var(--text-light);margin:1px 2px;}
.item-card .qty{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.92);border-radius:14px;padding:2px 9px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.item-card .qty.low{background:var(--danger-bg);color:var(--danger);}
.item-card .qty.none{background:#F1EDE6;color:#A79A86;}
.item-card .tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 2px 2px;}
.tag-chip{font-size:11px;background:var(--primary-soft);color:var(--primary-deep);padding:2px 8px;border-radius:20px;}
.item-card .ck{position:absolute;top:10px;left:10px;z-index:5;display:none;}
.batch-mode .ck{display:block;}
.item-card.batch-selected{outline:3px solid var(--primary);}
.mv-btns{position:absolute;top:8px;right:8px;z-index:6;display:flex;flex-direction:column;gap:3px;}
.mv-btns .btn{font-size:11px;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.img-arrows{display:flex;flex-direction:column;gap:2px;position:absolute;top:2px;right:2px;z-index:7;}
.img-arrows button{width:20px;height:20px;border-radius:8px;font-size:11px;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.mng-arrows{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.mng-arrows .btn{width:38px;height:34px;padding:0;justify-content:center;font-size:16px;border-radius:12px;background:var(--primary-soft);color:var(--primary-deep);}

/* 篩選列 */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-bar select,.filter-bar .btn{padding:8px 12px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;}
.filter-bar .btn:active{transform:scale(.96);}
.badge{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600;}
.badge.orange{background:var(--primary-soft);color:var(--primary-deep);}

/* ===== 列表行 ===== */
.row-list{display:flex;flex-direction:column;gap:10px;}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;}
.row-item .thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--bg2);flex-shrink:0;}
.row-item .info{flex:1;min-width:0;}
.row-item .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-item .info span{font-size:12.5px;color:var(--text-light);}

/* ===== 詳情頁 ===== */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-size:14px;margin-bottom:12px;padding:8px 12px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);}
.detail-wrap{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;}
.gallery{position:relative;}
.gallery-main{width:100%;aspect-ratio:1/1;border-radius:var(--radius);object-fit:cover;background:var(--bg2);box-shadow:var(--shadow);}
.gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.gallery-thumbs img{width:66px;height:66px;border-radius:12px;object-fit:cover;cursor:pointer;border:2px solid transparent;}
.gallery-thumbs img.on{border-color:var(--primary);}
.gallery-thumbs .gmain-tag{position:relative;}
.detail-body{min-width:0;}
.detail-body h2{margin:0 0 4px;font-size:24px;}
.detail-cat{color:var(--primary-deep);font-size:13px;font-weight:600;}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0;}
.kv{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;}
.kv .k{font-size:12px;color:var(--text-light);}
.kv .v{font-size:14.5px;font-weight:600;margin-top:2px;word-break:break-all;}
.kv .v.link{color:var(--primary-deep);cursor:pointer;}
.qty-box{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--primary),var(--accent2));color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;box-shadow:var(--shadow);}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
.btn{padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--shadow);}
.btn.soft{background:var(--primary-soft);color:var(--primary-deep);}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--text);}
.btn.danger{background:var(--danger-bg);color:var(--danger);}
.btn.success{background:var(--success);color:#fff;box-shadow:var(--shadow);}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--primary-deep);font-size:13.5px;font-weight:600;}

/* 流水 */
.timeline{list-style:none;margin:0;padding:0;position:relative;}
.timeline:before{content:'';position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:var(--line);}
.timeline li{position:relative;padding:8px 0 8px 34px;}
.timeline li:before{content:'';position:absolute;left:5px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-soft);}
.timeline li.out:before{background:var(--danger);box-shadow:0 0 0 2px var(--danger-bg);}
.tl-head{font-weight:600;font-size:14px;}
.tl-head .delta.in{color:var(--success);}
.tl-head .delta.out{color:var(--danger);}
.tl-meta{font-size:12px;color:var(--text-light);}

/* ===== 開關 ===== */
.switch{position:relative;width:46px;height:26px;display:inline-block;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#DCD3C2;border-radius:30px;transition:.2s;cursor:pointer;}
.slider:before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:var(--primary);}
.switch input:checked + .slider:before{transform:translateX(20px);}

/* ===== 表單 ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(90,70,50,.45);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 20px 30px;animation:slideUp .25s;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 16px;font-size:19px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
.form-row label .req{color:var(--danger);}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);outline:none;transition:.15s;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--primary);background:#fff;}
.form-row textarea{resize:vertical;min-height:70px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.form-section{font-size:13.5px;font-weight:700;color:var(--primary-deep);margin:20px 0 12px;padding-left:10px;border-left:3px solid var(--primary);}
.img-upload{display:flex;flex-wrap:wrap;gap:10px;}
.img-up-box{width:74px;height:74px;border-radius:14px;border:2px dashed var(--accent2);display:flex;align-items:center;justify-content:center;color:var(--primary-deep);font-size:24px;cursor:pointer;background:var(--card2);}
.img-thumb{width:74px;height:74px;border-radius:14px;object-fit:cover;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.img-item{position:relative;}
.img-item .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.img-item .main-tag{position:absolute;left:4px;bottom:4px;background:var(--primary);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;}
.img-item .setmain{position:absolute;right:4px;bottom:4px;background:rgba(255,255,255,.9);font-size:10px;padding:1px 7px;border-radius:10px;cursor:pointer;color:var(--primary-deep);}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;}
.tag-input-wrap .tag-chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;background:var(--primary-soft);color:var(--primary-deep);padding:4px 10px;border-radius:20px;}
.tag-input-wrap .tag-chip .x{cursor:pointer;font-weight:700;}
.tag-input-wrap input{flex:1;min-width:90px;border:none;background:none;padding:6px;outline:none;}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.seg{display:inline-flex;background:var(--bg2);border-radius:30px;padding:4px;}
.seg button{padding:8px 16px;border-radius:26px;font-size:14px;color:var(--text-light);font-weight:600;}
.seg button.on{background:var(--primary);color:#fff;box-shadow:var(--shadow);}

/* ===== 設定 / 區塊 ===== */
.set-card{padding:20px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin-bottom:18px;border:1px solid rgba(243,228,198,.6);}
.set-card h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px;}
.set-card .desc{font-size:13px;color:var(--text-light);margin-bottom:14px;}
.set-card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.cloud-status{font-size:13px;padding:8px 12px;border-radius:12px;background:var(--bg2);}
.cloud-status.ok{background:var(--success-bg);color:var(--success);}
.cloud-status.err{background:var(--danger-bg);color:var(--danger);}

/* ===== 表格（匯入預覽） ===== */
.table-wrap{overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:14px;}
table.pv{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
table.pv th,table.pv td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
table.pv th{background:var(--bg2);position:sticky;top:0;}
.err-row td{background:var(--danger-bg);}

/* ===== 統計 ===== */
.stats-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(#F7B32B 0 var(--p1),#F28E8E var(--p1) calc(var(--p1)+var(--p2)),#7CB342 calc(var(--p1)+var(--p2)) calc(var(--p1)+var(--p2)+var(--p3)),#6FA8DC calc(var(--p1)+var(--p2)+var(--p3)) 100%);position:relative;flex-shrink:0;box-shadow:var(--shadow);}
.donut:after{content:attr(data-n);position:absolute;inset:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line);}
.legend{flex:1;min-width:0;}
.legend .li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;}
.legend .sw{width:12px;height:12px;border-radius:4px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
.bar-row .bl{width:70px;flex-shrink:0;text-align:right;}
.bar-row .bt{flex:1;height:16px;background:var(--bg2);border-radius:8px;overflow:hidden;}
.bar-row .bf{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--primary),var(--accent2));}

/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#5A4632;color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 響應式 ===== */
@media (max-width:900px){
  #sidebar{display:none;}
  #mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);z-index:100;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  #mnav .mn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:10.5px;color:var(--text-light);border-radius:12px;}
  #mnav .mn .mi{font-size:20px;}
  #mnav .mn.active{color:var(--primary-deep);font-weight:700;background:var(--primary-soft);}
  #views{padding:16px 14px 90px;}
  #topbar{padding:10px 14px;}
  .tb-title{display:none;}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .detail-wrap{grid-template-columns:1fr;}
  .stats-wrap{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .item-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .donut{width:120px;height:120px;}

}

}
@media (min-width:901px) and (max-width:1200px){

}
</style>

<script>
/* ============================================================
   暖暖收納 · 個人收藏管理
   純前端 + 選配 Firebase（Firestore）多端同步
   ============================================================ */

/* ---------- 常數與預設 ---------- */
const LS_KEY = 'warm_storage_v1';
const FB_KEY = 'warm_storage_fb_v1';
const PLATFORMS = ['淘寶','蝦皮','拼多多','天貓','京東','官網','實體店面','其他'];
const PRESET_CATEGORIES = [
  {id:'cat_yarn', name:'毛線', icon:'🧶', color:'#F7A35C', defaultUnit:'團', lowStock:2,
   customFields:[
     {key:'品牌', type:'text'},
     {key:'顏色/色號', type:'text'},
     {key:'品相', type:'select', options:['全新','近新','良好','一般','已拆用']},
     {key:'材質', type:'text'}
   ]},
  {id:'cat_doll', name:'公仔', icon:'🧸', color:'#F7B32B', defaultUnit:'隻', lowStock:0,
   customFields:[
     {key:'IP', type:'text'},
     {key:'尺寸', type:'text'},
     {key:'是否絕版', type:'select', options:['是','否']}
   ]},
  {id:'cat_idol', name:'偶像周邊', icon:'💿', color:'#F28E8E', defaultUnit:'個', lowStock:0,
   customFields:[
     {key:'藝人', type:'text'},
     {key:'專輯歸屬', type:'text'},
     {key:'卡面編號', type:'text'},
     {key:'品相', type:'select', options:['全新','近新','良好','一般','已拆用']}
   ]}
];

/* ---------- 狀態 ---------- */
let state = {
  v: 1,
  updatedAt: Date.now(),
  categories: [],   // {id,name,icon,color,defaultUnit,lowStock,customFields:[{key,type,options}]}
  tags: [],         // {id,name}
  items: [],        // 物品
  fbConfig: null,
  lowStockDefault: 1
};

let fb = { app:null, db:null, ready:false, listening:false, lastSync:0 };
let currentView = 'home';
let currentCatId = null;
let currentItemId = null;
let sortModes = {};   // {manage:false}
let batchMode = false, batchSel = new Set();
let pendingImages = [];   // 表單暫存圖片 [{dataUrl,isMain}]
let importResult = null;

/* ---------- 工具 ---------- */
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function fmtTime(t){ if(!t) return '—'; const d=new Date(t); if(isNaN(d)) return '—'; return d.toLocaleString('zh-TW',{hour12:false}); }
function fmtDate(t){ if(!t) return ''; const d=new Date(t); if(isNaN(d)) return ''; return d.toLocaleDateString('zh-TW'); }
function toast(msg, ms=2000){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms); }
function getCat(id){ return state.categories.find(c=>c.id===id); }
function getItem(id){ return state.items.find(i=>i.id===id); }
function qtyOf(item){ let q=num(item.initialQty||0); for(const r of item.stockRecords||[]){ q += r.type==='in'?num(r.qty):-num(r.qty); } return q; }
function totalSpend(item){ if(num(item.totalPrice||0)>0) return num(item.totalPrice); return num(item.price||0)*Math.max(1,num(item.initialQty||1)); }
function lowState(item){ const c=getCat(item.categoryId); const th = c? num(c.lowStock||0) : state.lowStockDefault; const q=qtyOf(item); if(q<=0) return 'none'; if(th>0 && q<=th) return 'low'; return 'ok'; }

/* ---------- 本地持久化 ---------- */
function loadState(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d && d.v===1){ state=Object.assign(state,d); return; } } }catch(e){}
  if(!state.categories.length){ state.categories = JSON.parse(JSON.stringify(PRESET_CATEGORIES)); }
  if(!state.tags.length){ state.tags = [{id:'tag_want',name:'想買'},{id:'tag_fav',name:'最愛'}]; }
  saveLocal();
}
function saveLocal(){ state.updatedAt=Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ toast('⚠️ 本地儲存空間不足，圖片可能過多'); } }
function saveState(){ saveLocal(); cloudPushDebounced(); }

/* ---------- Firebase 同步 ---------- */
function loadFBConfig(){ try{ const raw=localStorage.getItem(FB_KEY); if(raw){ state.fbConfig=JSON.parse(raw); } }catch(e){ state.fbConfig=null; } }
function saveFBConfig(){ state.fbConfig ? localStorage.setItem(FB_KEY, JSON.stringify(state.fbConfig)) : localStorage.removeItem(FB_KEY); }
async function initFirebase(){
  if(!state.fbConfig || !state.fbConfig.apiKey) return;
  try{
    if(fb.app===null){ fb.app = firebase.initializeApp(state.fbConfig, 'warm'); }
    fb.db = firebase.firestore(fb.app);
    fb.ready = true;
    updateSyncUI();
    startRealtime();
    await pullFromCloud(true);
  }catch(e){ fb.ready=false; updateSyncUI(); console.error(e); }
}
async function testFirebase(){
  if(!state.fbConfig || !state.fbConfig.apiKey){ toast('請先填寫 Firebase 設定'); return; }
  try{
    if(fb.app===null){ fb.app = firebase.initializeApp(state.fbConfig, 'warm'); }
    fb.db = firebase.firestore(fb.app);
    const snap = await fb.db.collection('warm_storage').doc('main').get();
    fb.ready = true; updateSyncUI();
    toast('✅ Firebase 連線成功');
    startRealtime();
    await pullFromCloud(false);
  }catch(e){ console.error(e); fb.ready=false; updateSyncUI(); toast('❌ 連線失敗：'+ (e.message||'請檢查設定')); }
}
function updateSyncUI(){
  const pill=document.getElementById('syncPill'); const txt=document.getElementById('syncText');
  if(fb.ready){ pill.className='sync-pill on'; txt.textContent='雲端已同步'; }
  else{ pill.className='sync-pill off'; txt.textContent= state.fbConfig?'雲端未連線':'未連線雲端'; }
}
function cloudDocRef(){ return fb.db.collection('warm_storage').doc('main'); }
let pushTimer=null;
function cloudPushDebounced(){ if(!fb.ready) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>cloudPush(), 600); }
async function cloudPush(){
  if(!fb.ready) return;
  try{
    const data = { json: JSON.stringify(state), updatedAt: Date.now() };
    await cloudDocRef().set(data);
    fb.lastSync=Date.now(); updateSyncUI();
  }catch(e){ console.error('push fail',e); }
}
async function pullFromCloud(silent){
  if(!fb.ready) return;
  try{
    const snap = await cloudDocRef().get();
    if(snap.exists){
      const remote = snap.data();
      const remoteTs = num(remote.updatedAt);
      if(remoteTs > state.updatedAt){
        const d = JSON.parse(remote.json);
        if(d && d.v===1){ state = Object.assign(state, d); saveLocal(); }
        toast('☁️ 已從雲端載入最新資料');
      } else if(remoteTs < state.updatedAt){
        await cloudPush();
      }
    } else {
      await cloudPush(); // 首次上傳
    }
    updateSyncUI(); renderAll();
  }catch(e){ console.error('pull fail',e); }
}
function startRealtime(){
  if(!fb.ready || fb.listening) return;
  fb.listening = true;
  cloudDocRef().onSnapshot((snap)=>{
    if(!snap.exists) return;
    const remote = snap.data();
    if(num(remote.updatedAt) > state.updatedAt && num(remote.updatedAt) !== fb.lastSync){
      try{
        const d = JSON.parse(remote.json);
        if(d && d.v===1){ state = Object.assign(state,d); saveLocal(); updateSyncUI(); renderAll(); toast('☁️ 其他裝置已更新資料'); }
      }catch(e){}
    }
  }, (e)=>console.error('realtime err',e));
}
async function syncNow(){
  if(!fb.ready){ if(state.fbConfig){ await testFirebase(); } else { toast('尚未綁定 Firebase，請到設定填寫'); } return; }
  toast('🔄 同步中…');
  await cloudPush(); await pullFromCloud(false); toast('✅ 同步完成');
}
function unbindFirebase(){
  if(fb.app){ try{ firebase.deleteApp(fb.app); }catch(e){} }
  fb = { app:null,db:null,ready:false,listening:false,lastSync:0 };
  state.fbConfig=null; saveFBConfig(); updateSyncUI(); toast('已解除雲端綁定'); renderSettings();
}

/* ---------- 路由 ---------- */
function navigate(hash){ location.hash = hash; }
window.addEventListener('hashchange', router);
function router(){
  const h = location.hash.replace(/^#\/?/,'') || 'home';
  const parts = h.split('/');
  batchMode=false; batchSel.clear();
  if(parts[0]==='cat'){ currentCatId=parts[1]; showView('view-cat'); renderCatList(); }
  else if(parts[0]==='item'){ currentItemId=parts[1]; showView('view-detail'); renderDetail(); }
  else if(parts[0]==='manage'){ showView('view-manage'); renderManage(); }
  else if(parts[0]==='tags'){ showView('view-tags'); renderTags(); }
  else if(parts[0]==='stats'){ showView('view-stats'); renderStats(); }
  else if(parts[0]==='settings'){ showView('view-settings'); renderSettings(); }
  else { showView('view-home'); renderHome(); }
  syncNav();
}
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function syncNav(){
  let key='home';
  if(location.hash.startsWith('#cat')) key='manage';
  else if(location.hash.startsWith('#item')) key='manage';
  else if(location.hash.startsWith('#manage')) key='manage';
  else if(location.hash.startsWith('#tags')) key='tags';
  else if(location.hash.startsWith('#stats')) key='stats';
  else if(location.hash.startsWith('#settings')) key='settings';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.nav===key));
  document.querySelectorAll('#mnav .mn').forEach(n=>n.classList.toggle('active', n.dataset.nav===key));
}
document.querySelectorAll('.nav-item, #mnav .mn').forEach(el=>{
  el.addEventListener('click', ()=>navigate('#/'+el.dataset.nav));
});

/* ---------- 首頁 ---------- */
function renderHome(){
  const el=document.getElementById('view-home');
  const totalItems = state.items.length;
  const totalSpendSum = state.items.reduce((s,i)=>s+totalSpend(i),0);
  const lowCount = state.items.filter(i=>lowState(i)==='low'||lowState(i)==='none').length;
  const catCount = state.categories.length;
  const catCards = [...state.categories].map(c=>{
    const items = state.items.filter(i=>i.categoryId===c.id);
    const low = items.filter(i=>lowState(i)==='low').length;
    const none = items.filter(i=>lowState(i)==='none').length;
    return `<div class="cat-card" data-id="${c.id}" onclick="openCat('${c.id}')" title="點擊進入">
      <div class="count-badge">${items.length} 件</div>
      ${(low+none)>0?`<div class="low">⚠️ ${low+none} 件需補貨</div>`:''}
      <div class="ico" style="background:${c.color}22">${c.icon}</div>
      <h3>${esc(c.name)}</h3>
      <div class="meta">${items.length>0?`共 ${items.reduce((s,i)=>s+Math.max(0,qtyOf(i)),0)} ${esc(c.defaultUnit||'件')}`:'尚無物品'}</div>
    </div>`;
  }).join('') || `<div style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:40px;">還沒有品類，<a href="#/manage">前往品類管理</a>新增</div>`;

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><span class="em">📦</span><div class="v">${totalItems}</div><div class="l">物品總數</div></div>
      <div class="stat-card"><span class="em">💰</span><div class="v">$${totalSpendSum.toLocaleString()}</div><div class="l">總花費</div></div>
      <div class="stat-card"><span class="em">🗂️</span><div class="v">${catCount}</div><div class="l">品類數</div></div>
      <div class="stat-card" style="cursor:pointer" onclick="navigate('#/stats')"><span class="em">⚠️</span><div class="v">${lowCount}</div><div class="l">需補貨提醒</div></div>
    </div>
    <div class="sec-title"><h2>我的收藏</h2><span class="sub">長按可拖拽排序</span></div>
    <div class="cat-grid" id="homeCatGrid">${catCards}</div>`;

  // 品類拖拽排序
  if(window.Sortable && document.getElementById('homeCatGrid')){
    new Sortable(document.getElementById('homeCatGrid'), {
      animation:200, delay:600, delayOnTouchOnly:true,
      ghostClass:'sortable-ghost', dragClass:'sortable-drag', chosenClass:'sort-ghost',
      onEnd:()=>{ saveCategoryOrderFromDom('homeCatGrid'); }
    });
  }
}
function saveCategoryOrderFromDom(gridId){
  const grid=document.getElementById(gridId);
  if(!grid) return;
  const order=[...grid.querySelectorAll('.cat-card')].map(n=>n.dataset.id);
  const map={}; state.categories.forEach((c,i)=>map[c.id]=i);
  state.categories.sort((a,b)=>(order.indexOf(a.id)-order.indexOf(b.id)));
  state.categories.forEach((c,i)=>c.order=i);
  saveState();
}
function openCat(id){ navigate('#/cat/'+id); }

/* ---------- 品類列表頁 ---------- */
let filterState = { q:'', cat:'', tag:'', stock:'' };
function renderCatList(){
  const cat = getCat(currentCatId);
  if(!cat){ navigate('#/home'); return; }
  const el = document.getElementById('view-cat');
  let items = state.items.filter(i=>i.categoryId===cat.id);
  const q = (filterState.q||'').trim().toLowerCase();
  if(q){
    items = items.filter(i=>{
      const c = getItemFieldText(i);
      return c.toLowerCase().includes(q);
    });
  }
  if(filterState.tag){ items = items.filter(i=>(i.tags||[]).includes(filterState.tag)); }
  if(filterState.stock==='low') items = items.filter(i=>lowState(i)==='low');
  else if(filterState.stock==='none') items = items.filter(i=>lowState(i)==='none');
  else if(filterState.stock==='ok') items = items.filter(i=>lowState(i)==='ok');

  const isCustomSort = sortModes['cat:'+cat.id]===true;
  if(!isCustomSort){
    items = [...items].sort((a,b)=>{
      const c = getCat(a.categoryId); if(c && c.id==='cat_yarn') return 0;
      return 0;
    });
    // 預設排序：低庫存優先 → 時間新在前
    items.sort((a,b)=>{
      const la=lowState(a), lb=lowState(b);
      const rank={none:0,low:1,ok:2};
      if(rank[la]!==rank[lb]) return rank[la]-rank[lb];
      return (num(b.createdAt||0))-(num(a.createdAt||0));
    });
  }

  const tagOpts = state.tags.map(t=>`<option value="${esc(t.name)}" ${filterState.tag===t.name?'selected':''}>${esc(t.name)}</option>`).join('');
  const stockOpts = ['ok','low','none'].map(s=>{
    const lb={ok:'有庫存',low:'低庫存',none:'無庫存'}[s];
    return `<option value="${s}" ${filterState.stock===s?'selected':''}>${lb}</option>`;
  }).join('');

  el.innerHTML = `
    <button class="back-btn" onclick="navigate('#/home')">← 返回</button>
    <div class="sec-title"><h2 style="display:flex;align-items:center;gap:8px;"><span style="font-size:26px">${cat.icon}</span>${esc(cat.name)} <span class="badge orange">${items.length} 件</span></h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <label class="switch" title="切換排序模式"><input type="checkbox" ${isCustomSort?'checked':''} onchange="toggleCustomSort('${cat.id}',this.checked)"><span class="slider"></span></label>
        <span style="font-size:12.5px;color:var(--text-light)">自訂排序</span>
        ${batchMode?`<button class="btn danger sm" onclick="exitBatch()">取消批量</button>`:`<button class="btn soft sm" onclick="enterBatch()">批量</button>`}
        <button class="btn primary sm" onclick="openItemForm(null,'${cat.id}')">＋ 新增物品</button>
      </div>
    </div>
    <div class="filter-bar">
      <input placeholder="搜尋此品類…" value="${esc(filterState.q)}" oninput="filterState.q=this.value;renderCatList()" style="padding:8px 12px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);outline:none;flex:1;min-width:140px">
      <select onchange="filterState.tag=this.value;renderCatList()"><option value="">全部標籤</option>${tagOpts}</select>
      <select onchange="filterState.stock=this.value;renderCatList()"><option value="">庫存狀態</option>${stockOpts}</select>
    </div>
    ${items.length===0?`<div style="text-align:center;color:var(--text-light);padding:50px 0;">沒有符合的物品</div>`:''}
    <div class="item-grid ${batchMode?'batch-mode':''}" id="catItemGrid">
      ${items.map(i=>itemCardHTML(i,isCustomSort)).join('')}
    </div>
    ${batchMode?`<div style="position:sticky;bottom:80px;margin-top:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1.5px solid var(--primary);">
      <b style="font-size:13.5px">已選 <span id="batchCount">${batchSel.size}</span> 項</b>
      <button class="btn soft sm" onclick="batchChangeCat()">改品類</button>
      <button class="btn soft sm" onclick="batchAddTag()">加標籤</button>
      <button class="btn danger sm" onclick="batchDelete()">刪除</button>
    </div>`:''}`;

  if(isCustomSort && window.Sortable && document.getElementById('catItemGrid')){
    new Sortable(document.getElementById('catItemGrid'), {
      animation:200, delay:600, delayOnTouchOnly:true,
      ghostClass:'sortable-ghost', dragClass:'sortable-drag',
      onEnd:()=>{

function moveItem(id, dir){

}
function renderImgList(){
  const box=document.getElementById('imgList'); if(!box) return;
  box.innerHTML = pendingImages.map((im,i)=>`
    <div class="img-item">
      <img class="img-thumb" src="${im.dataUrl}">
      <div class="img-arrows"><button onclick="movePendingImg(${i},-1)">↑</button><button onclick="movePendingImg(${i},1)">↓</button></div>

    </div>`).join('');

function setPendingMain(i){ pendingImages.forEach((im,k)=>im.isMain=(k===i)); renderImgList(); }
function movePendingImg(i, dir){
  const j=i+dir;
  if(i<0||j<0||j>=pendingImages.length) return;
  [pendingImages[i],pendingImages[j]]=[pendingImages[j],pendingImages[i]];
  renderImgList();
}
function removePendingImg(i){ pendingImages.splice(i,1); renderImgList(); }
function addTagChip(name){
  const w=document.getElementById('tagWrap'); const input=document.getElementById('tagInput');
  const chip=document.createElement('span'); chip.className='tag-chip'; chip.dataset.tag=name;
  chip.innerHTML=`${esc(name)}<span class="x" onclick="removeTagChip(this)">×</span>`;
  w.insertBefore(chip, input);
}
function removeTagChip(el){ el.parentNode.remove(); }
function onImgFiles(input){
  const files=[...input.files];
  if(!files.length) return;
  let done=0;
  files.forEach(f=>{
    if(f.size > 8*1024*1024){ toast('圖片過大，已略過'); done++; if(done===files.length) input.value=''; return; }
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=900; let w=img.width,h=img.height;
        if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        pendingImages.push({dataUrl:cv.toDataURL('image/jpeg',0.7), isMain:pendingImages.length===0});
        renderImgList(); done++; if(done===files.length) input.value='';
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}
function saveItemForm(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){ toast('請填寫名稱'); return; }
  const catId = document.getElementById('f_cat') ? document.getElementById('f_cat').value : (getItem(editingItemId)?.categoryId);
  const custom={};
  document.querySelectorAll('#modalItem [data-cf]').forEach(inp=>{ custom[inp.dataset.cf]=inp.value; });
  const tags=[...document.querySelectorAll('#tagWrap .tag-chip')].map(c=>c.dataset.tag);
  tags.forEach(t=>{ if(!state.tags.some(x=>x.name===t)) state.tags.push({id:uid(),name:t}); });
  const data={
    name,
    categoryId: catId,
    unit: document.getElementById('f_unit').value.trim() || (getCat(catId)||{}).defaultUnit || '',
    initialQty: num(document.getElementById('f_qty').value),
    images: pendingImages,
    tags,
    buyTime: document.getElementById('f_btime').value ? new Date(document.getElementById('f_btime').value+'T00:00:00').getTime() : '',
    platform: document.getElementById('f_platform').value,
    store: document.getElementById('f_store').value.trim(),
    buyLink: document.getElementById('f_link').value.trim(),
    price: document.getElementById('f_price').value,
    totalPrice: document.getElementById('f_total').value,
    note: document.getElementById('f_note').value.trim(),
    custom
  };
  if(editingItemId){
    const it=getItem(editingItemId);
    const keep={id:it.id, stockRecords:it.stockRecords||[], createdAt:it.createdAt, customOrder:it.customOrder};
    state.items = state.items.map(i=>i.id===editingItemId? Object.assign({},data,keep) : i);
    toast('✅ 已儲存');
  } else {
    data.id=uid(); data.createdAt=Date.now(); data.stockRecords=[];
    if(!data.images.length && !data.initialQty){ data.initialQty=1; }
    state.items.push(data);
    toast('✅ 已新增');
  }
  closeModal('modalItem');
  saveState();
  router();
}

      <div class="seg">
        <button class="${type==='in'?'on':''}" onclick="setStockType('in')">入庫（補貨）</button>

      </div>

    <div class="btn-row">
      <button class="btn ghost" onclick="closeModal('modalStock')">取消</button>

    </div>`);
}
function setStockType(t){ stockType=t; openStockForm(t); }
function saveStock(){
  const item=getItem(currentItemId); if(!item) return;
  const qty=num(document.getElementById('s_qty').value);
  if(qty<=0){ toast('請輸入有效數量'); return; }
  const note=document.getElementById('s_note').value.trim();
  const tInput=document.getElementById('s_time').value;
  const time=tInput? new Date(tInput).getTime() : Date.now();
  const type=stockType;
  if(type==='out' && qtyOf(item)-qty < 0){
    if(!confirm(`出庫 ${qty} 將使庫存變為負數（目前 ${qtyOf(item)}），仍要繼續？`)) return;
  }
  const rec={ id:uid(), type, qty, time, note };
  item.stockRecords = item.stockRecords||[]; item.stockRecords.push(rec);
  closeModal('modalStock');
  saveState();
  renderDetail();
  toast(type==='in'?'✅ 已入庫':'✅ 已出庫');
}

function moveCat(id, dir){

function saveCatForm(){
  const name=document.getElementById('c_name').value.trim();
  if(!name){ toast('請填寫品類名稱'); return; }
  const keys=document.getElementById('c_fields').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const customFields=keys.map(k=>({key:k,type:'text'}));
  const data={ name, icon:document.getElementById('c_icon').value.trim()||'📦', color:document.getElementById('c_color').value.trim()||'#F7B32B',
    defaultUnit:document.getElementById('c_unit').value.trim(), lowStock:num(document.getElementById('c_low').value),
    customFields };
  if(editingCatId){
    state.categories=state.categories.map(c=>c.id===editingCatId? Object.assign({},c,data):c);
    toast('✅ 已儲存');
  } else {
    state.categories.push(Object.assign({id:uid()},data));
    toast('✅ 已新增品類');
  }
  closeModal('modalCat'); saveState(); renderManage();

function deleteCat(id){
  const count=state.items.filter(i=>i.categoryId===id).length;
  if(count>0){ if(!confirm(`此品類內有 ${count} 件物品，刪除品類後這些物品也會被刪除，確定？`)) return; }
  else { if(!confirm('確定刪除此品類？')) return; }
  state.categories=state.categories.filter(c=>c.id!==id);
  state.items=state.items.filter(i=>i.categoryId!==id);
  saveState(); renderManage(); toast('已刪除');
}

function addTag(){
  const v=document.getElementById('newTagName').value.trim();

  saveState(); renderTags(); toast('✅ 已新增');
}

  const i=state.tags.findIndex(t=>t.id===id), j=i+dir;

  state.tags=state.tags.filter(x=>x.id!==id);

function renderStats(){
  const el=document.getElementById('view-stats');
  const cats=state.categories;
  const colors=cats.map(c=>c.color);
  const counts=cats.map(c=>state.items.filter(i=>i.categoryId===c.id).length);
  const total=counts.reduce((a,b)=>a+b,0)||1;
  const spend=cats.map(c=>state.items.filter(i=>i.categoryId===c.id).reduce((s,i)=>s+totalSpend(i),0));
  const totalSpendSum=spend.reduce((a,b)=>a+b,0);
  const lowItems=state.items.filter(i=>lowState(i)==='low'||lowState(i)==='none');
  const recentRecs = state.items.flatMap(i=>(i.stockRecords||[]).map(r=>Object.assign({itemName:i.name,cat:i.categoryId},r)))
    .sort((a,b)=>num(b.time)-num(a.time)).slice(0,8);

  // 環形圖（最多4色，其餘合併）
  let segs=cats.map((c,i)=>({name:c.name,icon:c.icon,color:c.color,count:counts[i],spend:spend[i]}));
  if(segs.length>4){ const rest=segs.slice(3); segs=segs.slice(0,3).concat([{name:'其他',icon:'📦',color:'#B9AE9B',count:rest.reduce((s,x)=>s+x.count,0),spend:rest.reduce((s,x)=>s+x.spend,0)}]); }
  let acc=0, donutPct='';
  segs.forEach((s,i)=>{ const pct=Math.round(s.count/total*100); donutPct += `--p${i+1}:${pct}%`+' '; });
  // 需要動態變數 --p1..--p4
  const styleVars = segs.map((s,i)=>{ const pct=Math.round(s.count/total*100); return `--p${i+1}:${pct}%`; }).join(';');
  const donutCSS = `background:conic-gradient(${segs.map((s,i)=>{
    const start=segs.slice(0,i).reduce((x,y)=>x+Math.round(y.count/total*100),0);
    return `${s.color} ${start}% ${start+Math.round(s.count/total*100)}%`;
  }).join(',')})`;

  const legend = segs.map(s=>`<div class="li"><span class="sw" style="background:${s.color}"></span><b>${s.icon} ${esc(s.name)}</b><span style="margin-left:auto">${s.count} 件 · $${s.spend.toLocaleString()}</span></div>`).join('');

  const barMax = Math.max(...counts,1);
  const bars = cats.map((c,i)=>`<div class="bar-row"><span class="bl">${c.icon} ${esc(c.name)}</span><div class="bt"><div class="bf" style="width:${Math.round(counts[i]/barMax*100)}%;background:${c.color}"></div></div><b style="width:40px">${counts[i]}</b></div>`).join('');

  const recHTML = recentRecs.map(r=>{
    const cat=getCat(r.cat);
    return `<div class="row-item" style="cursor:default"><div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:${r.type==='in'?'var(--success-bg)':'var(--danger-bg)'}">${r.type==='in'?'📥':'📤'}</div><div class="info"><b>${esc(r.itemName)}</b><span>${r.type==='in'?'入庫 +':'出庫 -'}${num(r.qty)} ${esc(cat?cat.defaultUnit:'')} · ${fmtTime(r.time)}${r.note?' · '+esc(r.note):''}</span></div></div>`;
  }).join('')||'<div style="color:var(--text-light);text-align:center;padding:24px">尚無出入庫記錄</div>';

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><span class="em">📦</span><div class="v">${state.items.length}</div><div class="l">物品總數</div></div>
      <div class="stat-card"><span class="em">💰</span><div class="v">$${totalSpendSum.toLocaleString()}</div><div class="l">總花費</div></div>
      <div class="stat-card"><span class="em">⚠️</span><div class="v">${lowItems.length}</div><div class="l">需補貨</div></div>
      <div class="stat-card"><span class="em">🧾</span><div class="v">${state.items.reduce((s,i)=>s+(i.stockRecords||[]).length,0)}</div><div class="l">流水筆數</div></div>
    </div>
    <div class="stats-wrap">
      <div class="card" style="padding:20px">
        <h3 style="margin:0 0 16px;font-size:17px">🧮 各品類占比</h3>
        <div class="donut-wrap">
          <div class="donut" style="${donutCSS}" data-n="${total}"></div>
          <div class="legend">${legend}</div>
        </div>
      </div>
      <div class="card" style="padding:20px">
        <h3 style="margin:0 0 16px;font-size:17px">📊 各品類數量</h3>
        ${bars}
      </div>
    </div>
    <div class="card" style="padding:20px;margin-top:18px">
      <h3 style="margin:0 0 12px;font-size:17px">🕑 最近出入庫</h3>
      <div class="row-list">${recHTML}</div>
    </div>`;
}

  const wb=XLSX.utils.book_new();
  // 物品資料 sheet（包含各品類欄位並集）
  const allKeys=[]; state.categories.forEach(c=>c.customFields.forEach(f=>{ if(!allKeys.includes(f.key)) allKeys.push(f.key); }));
  const common=['品類','名稱','建檔數量','單位','標籤','購買時間','購買平台','店鋪','購買連結','購買單價','實付總價','備註'];
  const headers=common.concat(allKeys);
  const row={};
  headers.forEach(h=>row[h]='');
  // 範例行
  const ex={品類:'毛線',名稱:'牛奶棉 淡黃色',建檔數量:5,單位:'團',標籤:'最愛',購買時間:'2026-01-01',購買平台:'蝦皮',店鋪:'範例毛線小舖',購買連結:'https://example.com',購買單價:45,實付總價:225,備註:'範例資料，可刪除'};
  if(allKeys.includes('品牌')) ex['品牌']='範例牌'; if(allKeys.includes('顏色/色號')) ex['顏色/色號']='C-01';
  const ws1=XLSX.utils.json_to_sheet([row,ex],{header:headers});
  ws1['!cols']=headers.map(h=>({wch: h.length>6?16:10}));
  XLSX.utils.book_append_sheet(wb,ws1,'物品資料');

  const ws2=XLSX.utils.json_to_sheet([
    {品類:'毛線',物品名稱:'牛奶棉 淡黃色',類型:'入庫',數量:3,時間:'2026-01-05 10:00',用途備註:'補貨'},
    {品類:'毛線',物品名稱:'牛奶棉 淡黃色',類型:'出庫',數量:1,時間:'2026-01-20 14:30',用途備註:'織圍巾'}
  ]);
  ws2['!cols']=[{wch:8},{wch:16},{wch:6},{wch:6},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,'出入庫記錄');

  const ws3=XLSX.utils.json_to_sheet(state.tags.map(t=>({標籤名稱:t.name})));
  XLSX.utils.book_append_sheet(wb,ws3,'標籤');
  XLSX.writeFile(wb,'暖暖收納_匯入模板.xlsx');
  toast('✅ 模板已下載');
}
function exportExcel(scope){
  const selCat = scope==='one' ? document.getElementById('expCatSel').value : null;
  const cats = selCat? [getCat(selCat)].filter(Boolean) : state.categories;
  const allKeys=[]; cats.forEach(c=>c.customFields.forEach(f=>{ if(!allKeys.includes(f.key)) allKeys.push(f.key); }));
  const common=['品類','名稱','建檔數量','單位','標籤','購買時間','購買平台','店鋪','購買連結','購買單價','實付總價','備註'];
  const headers=common.concat(allKeys);
  const wb=XLSX.utils.book_new();
  const rows=[];
  const items=state.items.filter(i=>cats.some(c=>c.id===i.categoryId));
  items.forEach(i=>{
    const c=getCat(i.categoryId);
    const r={};
    common.forEach(h=>r[h]='');
    r['品類']=c?c.name:''; r['名稱']=i.name; r['建檔數量']=num(i.initialQty||0); r['單位']=i.unit||(c?c.defaultUnit:'');
    r['標籤']=(i.tags||[]).join('、'); r['購買時間']=i.buyTime?fmtDate(i.buyTime):''; r['購買平台']=i.platform||''; r['店鋪']=i.store||'';
    r['購買連結']=i.buyLink||''; r['購買單價']=i.price!=null?i.price:''; r['實付總價']=i.totalPrice!=null?i.totalPrice:''; r['備註']=i.note||'';
    allKeys.forEach(k=>{ r[k] = (i.custom&&i.custom[k]!=null)? i.custom[k] : ''; });
    rows.push(r);
  });
  const ws1=XLSX.utils.json_to_sheet(rows.length?rows:[{}],{header:headers});
  ws1['!cols']=headers.map(h=>({wch: h.length>6?16:10}));
  XLSX.utils.book_append_sheet(wb,ws1,'物品資料');

  // 出入庫流水
  const recRows=[];
  items.forEach(i=>{ const c=getCat(i.categoryId); (i.stockRecords||[]).forEach(r=>{
    recRows.push({品類:c?c.name:'',物品名稱:i.name,類型:r.type==='in'?'入庫':r.type==='out'?'出庫':r.type,數量:r.qty,時間:fmtTime(r.time),用途備註:r.note||''});
  });});
  const ws2=XLSX.utils.json_to_sheet(recRows);
  ws2['!cols']=[{wch:8},{wch:16},{wch:6},{wch:6},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,'出入庫記錄');
  XLSX.writeFile(wb,`暖暖收納_${selCat?(getCat(selCat)||{}).name:'全部'}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('✅ 匯出完成');
}
function handleExcelFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      parseImport(wb);
    }catch(err){ console.error(err); toast('❌ 無法解析檔案'); }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
function parseImport(wb){
  const ws1=wb.Sheets['物品資料']; const ws2=wb.Sheets['出入庫記錄']; const ws3=wb.Sheets['標籤'];
  const errors=[]; let itemRows=[], recRows=[], tagRows=[];
  if(ws1) itemRows=XLSX.utils.sheet_to_json(ws1,{defval:''});
  if(ws2) recRows=XLSX.utils.sheet_to_json(ws2,{defval:''});
  if(ws3) tagRows=XLSX.utils.sheet_to_json(ws3,{defval:''});

  // 驗證物品
  const validatedItems=itemRows.map((r,idx)=>{
    const line=idx+2; const errs=[];
    const catName=String(r['品類']||'').trim();
    if(!catName){ errs.push('缺少品類'); }
    const name=String(r['名稱']||'').trim();
    if(!name){ errs.push('缺少名稱'); }
    if(r['建檔數量']!=='' && isNaN(parseFloat(r['建檔數量']))) errs.push('建檔數量需為數字');
    return {line,errs,row:r,catName,name};
  });
  const hasErr=validatedItems.some(v=>v.errs.length) || recRows.some((r,idx)=>{
    return (!String(r['物品名稱']||'').trim()) || (isNaN(parseFloat(r['數量'])) && r['數量']!=='') || (String(r['類型']||'')!=='入庫'&&String(r['類型']||'')!=='出庫'&&String(r['類型']||'')!=='');
  });
  // 存入全域
  importResult={itemRows:validatedItems,recRows,tagRows};
  showModal('modalImport', `
    <h3>📤 匯入預覽</h3>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:12px">
      物品資料 ${validatedItems.length} 行 · 出入庫 ${recRows.length} 行 · 標籤 ${tagRows.length} 行${hasErr?' · ⚠️ 有錯誤行，紅色標出，確認後將跳過錯誤行':''}
    </div>
    <div class="table-wrap">
      <table class="pv"><thead><tr><th>行</th><th>品類</th><th>名稱</th><th>數量</th><th>狀態</th></tr></thead>
      <tbody>${validatedItems.map(v=>`<tr class="${v.errs.length?'err-row':''}"><td>${v.line}</td><td>${esc(v.catName)}</td><td>${esc(v.name)}</td><td>${esc(v.row['建檔數量'])}</td><td>${v.errs.length?esc(v.errs.join('；')):'✅'}</td></tr>`).join('')||'<tr><td colspan="5">無物品資料</td></tr>'}</tbody></table>
    </div>
    <div class="btn-row"><button class="btn ghost" onclick="closeModal('modalImport')">取消</button><button class="btn primary" onclick="confirmImport()">✅ 確認匯入（${hasErr?'跳過錯誤行':''}）</button></div>`);
}
function confirmImport(){
  const res=importResult; if(!res) return;
  let added=0, skipped=0;
  const nameMap={}; // 品類+名稱 -> itemId（用於流水匹配）
  res.itemRows.forEach(v=>{
    if(v.errs.length){ skipped++; return; }
    const r=v.row;
    let cat=getCatByName(v.catName);
    if(!cat){ cat={id:uid(),name:v.catName,icon:'📦',color:'#F7B32B',defaultUnit:'',lowStock:state.lowStockDefault,customFields:[]}; state.categories.push(cat); }
    const custom={};
    cat.customFields.forEach(f=>{ if(r[f.key]!==''&&r[f.key]!=null) custom[f.key]=String(r[f.key]); });
    const tags=String(r['標籤']||'').split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
    tags.forEach(t=>{ if(!state.tags.some(x=>x.name===t)) state.tags.push({id:uid(),name:t}); });
    const item={ id:uid(), name:v.name, categoryId:cat.id, unit:String(r['單位']||'').trim()||cat.defaultUnit||'',
      initialQty:num(r['建檔數量']), images:[], tags, custom,
      buyTime:r['購買時間']? new Date(String(r['購買時間'])).getTime() || '' : '',
      platform:String(r['購買平台']||''), store:String(r['店鋪']||''), buyLink:String(r['購買連結']||''),
      price:r['購買單價']!==''?r['購買單價']:null, totalPrice:r['實付總價']!==''?r['實付總價']:null,
      note:String(r['備註']||''), stockRecords:[], createdAt:Date.now() };
    state.items.push(item);
    nameMap[cat.name+'|'+item.name]=item.id;
    added++;
  });
  // 流水
  res.recRows.forEach((r,idx)=>{
    const catName=String(r['品類']||'').trim(); const itemName=String(r['物品名稱']||'').trim();
    const id=nameMap[catName+'|'+itemName] || findItemIdByName(catName,itemName);
    if(!id){ skipped++; return; }
    const item=getItem(id);
    let type=String(r['類型']||'').trim();
    if(type==='入庫') type='in'; else if(type==='出庫') type='out'; else return;
    const qty=num(r['數量']);
    const t=String(r['時間']||'').trim()? new Date(String(r['時間'])).getTime() : Date.now();
    const rec={id:uid(),type,qty,time:isNaN(t)?Date.now():t,note:String(r['用途備註']||'')};
    item.stockRecords=item.stockRecords||[]; item.stockRecords.push(rec);
  });
  // 標籤
  res.tagRows.forEach(r=>{ const n=String(r['標籤名稱']||'').trim(); if(n&&!state.tags.some(t=>t.name===n)) state.tags.push({id:uid(),name:n}); });
  importResult=null;
  closeModal('modalImport');
  saveState();
  toast(`✅ 匯入完成：新增 ${added} 筆${skipped?`，跳過 ${skipped} 筆`:''}`);
  router();
}
function getCatByName(name){
  return state.categories.find(c=>c.name===name);
}
function findItemIdByName(catName,itemName){
  const cat=getCatByName(catName); if(!cat) return null;
  const it=state.items.find(i=>i.categoryId===cat.id && i.name===itemName);
  return it?it.id:null;
}

/* ---------- JSON 備份 ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`暖暖收納備份_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(a.href); toast('✅ 備份已匯出');
}
function handleJSONFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d || d.v!==1){ toast('❌ 不是有效的備份檔'); return; }
      if(!confirm('匯入將覆蓋目前所有資料，確定？')) return;
      state=Object.assign(state,d); saveLocal();
      if(fb.ready) cloudPush();
      toast('✅ 已還原'); router();
    }catch(err){ toast('❌ 無法解析備份檔'); }
    input.value='';
  };
  reader.readAsText(file);
}

/* ---------- 全域搜尋 ---------- */
function onGlobalSearch(q){
  q=(q||'').trim(); if(!q){ return; }
  // 跳到第一個匹配品類的列表
  const items=state.items.filter(i=>getItemFieldText(i).toLowerCase().includes(q.toLowerCase()));
  if(items.length){ filterState.q=q; navigate('#/cat/'+items[0].categoryId); }
  else toast('沒有搜尋結果');
}

/* ---------- 模態框 ---------- */
function showModal(id, html){ document.getElementById(id).querySelector('.modal').innerHTML=html; document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show')); });

/* ---------- 渲染入口 ---------- */
function renderAll(){
  if(currentView==='home'||location.hash===''||location.hash==='#/'||location.hash==='#/home') renderHome();
  else if(location.hash.startsWith('#/cat')) renderCatList();
  else if(location.hash.startsWith('#/item')) renderDetail();
  else if(location.hash.startsWith('#/manage')) renderManage();
  else if(location.hash.startsWith('#/tags')) renderTags();
  else if(location.hash.startsWith('#/stats')) renderStats();
  else if(location.hash.startsWith('#/settings')) renderSettings();
}

/* ---------- 啟動 ---------- */
loadState(); loadFBConfig(); updateSyncUI();
if(!location.hash) navigate('#/home'); else router();
initFirebase();
</script>
